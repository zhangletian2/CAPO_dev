model:
  arch: clip

  # model_type: ViT-L-14-336
  # model_type: ViT-L-14
  model_type: ViT-B-16

datasets:
  dual_image_retrieval: # 指定新的数据集构建器名称
    vis_processor:
        train:
          name: "clip_image_train"
          # image_size: 336
          image_size: 224
        eval:
          name: "clip_image_eval"
          # image_size: 336
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"

run:
  task: retrieval

  # 数据加载
  num_workers: 4
  batch_size_train: 1
  batch_size_eval: 1

  test_splits: ["test"]

  # 分布式设置
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
  use_dist_eval_sampler: False

  # 杂项设置
  seed: 42
  # output_dir: "/YOUR/PATH"
  output_dir: "/data4/workspace/zlt/CAPO_ret/output/clip/Retrieval_COCO"

  evaluate: True